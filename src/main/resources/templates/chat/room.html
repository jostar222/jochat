<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${roomDisplayName}">채팅방</title>

    <link rel="stylesheet" href="/css/chat.css">

    <!-- CSRF -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>

<body>

<div class="container">

    <!-- 좌측 채팅방 목록 -->
    <div class="sidebar">
        <div class="sidebar-header">채팅</div>

        <div class="room-list">
            <a th:each="r : ${rooms}"
               th:href="@{/chat/rooms/{roomId}(roomId=${r.roomId})}"
               class="room-item"
               th:attr="data-room-id=${r.roomId}"
               th:classappend="${selectedRoomId != null and selectedRoomId == r.roomId} ? ' active'">

                <div class="room-top">
                    <div class="room-name" th:text="${r.roomName}">채팅방명</div>
                    <div class="room-time"
                         th:text="${r.lastMessageTime != null ? #temporals.format(r.lastMessageTime, 'HH:mm') : ''}">
                    </div>
                </div>

                <div class="room-bottom">
                    <div class="room-last-message"
                         th:text="${r.lastMessage != null and !#strings.isEmpty(r.lastMessage) ? r.lastMessage : '대화를 시작해보세요.'}">
                    </div>

                    <div class="unread-badge"
                         th:if="${r.unreadCount > 0}"
                         th:text="${r.unreadCount}">
                    </div>
                </div>
            </a>
        </div>

        <div class="user-section">

            <div class="random-section">
                <div class="online-count">
                    현재 접속자 <span id="onlineCount">0</span>명
                </div>

                <button type="button" id="randomChatBtn" class="random-chat-btn">
                    랜덤채팅하기
                </button>

                <button type="button" id="cancelRandomChatBtn" class="cancel-random-chat-btn" style="display:none;">
                    랜덤채팅 취소
                </button>

                <div id="randomWaitingText" class="random-waiting-text" style="display:none;">
                    상대를 기다리는 중...
                </div>
            </div>

            <div class="user-section-title">새 대화 시작</div>

            <div th:each="user : ${users}" class="user-item">
                <div class="user-name" th:text="${user.nickname}"></div>

                <form method="post" th:action="@{/chat/rooms/direct}">
                    <input type="hidden" name="targetUserId" th:value="${user.id}">
                    <button type="submit" class="start-chat-btn">채팅하기</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 우측 채팅 영역 -->
    <div class="chat-area">

        <div class="chat-header chat-header-with-action">
            <span th:text="${roomDisplayName}"></span>
            <button type="button" id="leaveRoomBtn" class="leave-room-btn">나가기</button>
        </div>

        <div id="chatBody" class="chat-body"></div>

        <div class="chat-footer">
            <input type="text" id="messageInput" placeholder="메시지를 입력하세요">
            <button id="sendBtn">전송</button>
        </div>

    </div>
</div>

<script th:inline="javascript">
    const roomId = [[${room.id}]];
    const loginUserId = [[${loginUserId}]];
</script>

<script>
    const chatBody = document.getElementById('chatBody');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    let stompClient = null;
    let isStompConnected = false;
    let reconnectTimer = null;
    let lastTime = null;
    let leavingRoom = false;

    // =========================
    // 메시지 렌더링
    // =========================
    function clearMessages() {
        chatBody.innerHTML = '';
        lastTime = null;
    }

    function renderMessage(msg) {
        const isMe = msg.senderId === loginUserId;

        if (msg.time !== lastTime) {
            const timeDiv = document.createElement('div');
            timeDiv.className = 'time-divider';
            timeDiv.textContent = msg.time;
            chatBody.appendChild(timeDiv);
            lastTime = msg.time;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'message ' + (isMe ? 'me' : 'other');

        const contentGroup = document.createElement('div');
        contentGroup.className = 'message-content-group';

        const bubbleWrap = document.createElement('div');

        if (!isMe) {
            const name = document.createElement('div');
            name.className = 'sender-name';
            name.textContent = msg.senderNickname;
            bubbleWrap.appendChild(name);
        }

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = msg.content;

        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = msg.time;

        bubbleWrap.appendChild(bubble);

        if (isMe) {
            contentGroup.appendChild(time);
            contentGroup.appendChild(bubbleWrap);
        } else {
            contentGroup.appendChild(bubbleWrap);
            contentGroup.appendChild(time);
        }

        wrapper.appendChild(contentGroup);
        chatBody.appendChild(wrapper);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    // =========================
    // 메시지 조회
    // =========================
    async function loadMessages() {
        const res = await fetch(`/api/chat/rooms/${roomId}/messages`);
        const data = await res.json();

        clearMessages();
        data.forEach(renderMessage);
    }

    // =========================
    // 읽음 처리
    // =========================
    async function markRoomAsRead(roomId) {
        try {
            await fetch(`/api/chat/rooms/${roomId}/read`, {
                method: 'POST',
                headers: {
                    [csrfHeader]: csrfToken
                }
            });

            clearUnreadBadge(roomId);
        } catch (e) {
            console.error('읽음 처리 실패', e);
        }
    }

    // =========================
    // 채팅방 목록 업데이트
    // =========================
    function updateUnreadBadge(roomItem, unreadCount) {
        let badge = roomItem.querySelector('.unread-badge');

        if (!unreadCount || unreadCount <= 0) {
            if (badge) badge.remove();
            return;
        }

        if (!badge) {
            badge = document.createElement('div');
            badge.className = 'unread-badge';
            roomItem.querySelector('.room-bottom').appendChild(badge);
        }

        badge.textContent = unreadCount;
    }

    function applyRoomListUpdate(update) {
        const roomItem = document.querySelector(`.room-item[data-room-id="${update.roomId}"]`);

        if (!roomItem) {
            location.reload();
            return;
        }

        const lastMessageEl = roomItem.querySelector('.room-last-message');
        const timeEl = roomItem.querySelector('.room-time');
        const roomList = document.querySelector('.room-list');

        if (lastMessageEl) {
            lastMessageEl.textContent = update.lastMessage || '대화를 시작해보세요.';
        }

        if (timeEl) {
            timeEl.textContent = update.lastMessageTime || '';
        }

        if (update.roomId === roomId) {
            updateUnreadBadge(roomItem, 0);
        } else {
            updateUnreadBadge(roomItem, update.unreadCount);
        }

        if (roomList && roomList.firstElementChild !== roomItem) {
            roomList.prepend(roomItem);
        }
    }

    function clearUnreadBadge(roomId) {
        const roomItem = document.querySelector(`.room-item[data-room-id="${roomId}"]`);
        if (!roomItem) return;

        const badge = roomItem.querySelector('.unread-badge');
        if (badge) badge.remove();
    }

    // =========================
    // WebSocket
    // =========================
    function scheduleReconnect() {
        if (reconnectTimer) return;

        reconnectTimer = setTimeout(() => {
            reconnectTimer = null;
            connect();
        }, 1500);
    }

    function connect() {
        const socket = new SockJS('/ws-chat');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, async () => {
            console.log('connected');
            isStompConnected = true;

            stompClient.subscribe('/sub/online.count', (message) => {
                const parsed = JSON.parse(message.body);
                applyOnlineCount(parsed);
            });

            await loadOnlineCount();

            setTimeout(loadOnlineCount, 300);

            stompClient.subscribe(`/sub/chat.room.${roomId}`, async (message) => {
                console.log('🔥 rooms event:', message.body);  // 👈 이거 추가
                const parsed = JSON.parse(message.body);
                renderMessage(parsed);
                await markRoomAsRead(roomId);
            });

            stompClient.subscribe('/user/queue/rooms', (message) => {
                const parsed = JSON.parse(message.body);
                applyRoomListUpdate(parsed);
            });

            stompClient.subscribe('/user/queue/random-match', (message) => {
                const data = JSON.parse(message.body);

                if (data.matched && data.roomId) {
                    location.href = `/chat/rooms/${data.roomId}`;
                }
            });

            stompClient.subscribe('/user/queue/rooms-deleted', (message) => {
                const data = JSON.parse(message.body);

                const roomItem = document.querySelector(`.room-item[data-room-id="${data.roomId}"]`);
                if (roomItem) {
                    roomItem.remove();
                }

                if (data.roomId === roomId) {
                    if (data.roomId === roomId) {
                        if (!leavingRoom) {
                            alert(data.message);
                        }

                        location.href = '/chat/rooms';
                    }
                }
            });

        }, (error) => {
            console.error('stomp error', error);
            isStompConnected = false;
            scheduleReconnect();
        });

        socket.onclose = () => {
            isStompConnected = false;
            scheduleReconnect();
        };
    }

    // =========================
    // 전송
    // =========================
    function sendMessage() {
        const content = input.value.trim();
        if (!content) return;

        if (!stompClient || !isStompConnected) {
            console.warn('연결 안됨');
            return;
        }

        stompClient.send('/pub/chat.send', {}, JSON.stringify({
            roomId: roomId,
            content: content
        }));

        input.value = '';
        input.focus();
    }

    sendBtn.addEventListener('click', sendMessage);

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    async function loadOnlineCount() {
        try {
            const res = await fetch('/api/random-chat/online-count');

            if (!res.ok) {
                console.error('online-count 조회 실패:', res.status);
                return;
            }

            const count = await res.json();

            const onlineCountEl = document.getElementById('onlineCount');
            if (onlineCountEl) {
                onlineCountEl.textContent = count;
            }
        } catch (e) {
            console.error('online-count 조회 오류:', e);
        }
    }

    function applyOnlineCount(update) {
        const onlineCountEl = document.getElementById('onlineCount');
        if (onlineCountEl) {
            onlineCountEl.textContent = update.onlineCount;
        }
    }

    // =========================
    // init
    // =========================
    async function init() {
        await loadMessages();
        clearUnreadBadge(roomId);
        connect();
    }

    init();

    const randomChatBtn = document.getElementById('randomChatBtn');
    const cancelRandomChatBtn = document.getElementById('cancelRandomChatBtn');
    const randomWaitingText = document.getElementById('randomWaitingText');

    function setRandomWaitingMode(waiting) {
        if (randomChatBtn) {
            randomChatBtn.style.display = waiting ? 'none' : 'block';
        }

        if (cancelRandomChatBtn) {
            cancelRandomChatBtn.style.display = waiting ? 'block' : 'none';
        }

        if (randomWaitingText) {
            randomWaitingText.style.display = waiting ? 'block' : 'none';
        }
    }

    if (randomChatBtn) {
        randomChatBtn.addEventListener('click', async () => {
            const res = await fetch('/api/random-chat/match', {
                method: 'POST',
                headers: {
                    [csrfHeader]: csrfToken
                }
            });

            const data = await res.json();

            if (!data.success) {
                alert(data.message);
                return;
            }

            setRandomWaitingMode(data.waiting);
        });
    }

    if (cancelRandomChatBtn) {
        cancelRandomChatBtn.addEventListener('click', async () => {
            const res = await fetch('/api/random-chat/cancel', {
                method: 'POST',
                headers: {
                    [csrfHeader]: csrfToken
                }
            });

            const data = await res.json();

            alert(data.message);
            setRandomWaitingMode(false);
        });
    }

    const leaveRoomBtn = document.getElementById('leaveRoomBtn');

    if (leaveRoomBtn) {
        leavingRoom = true;

        leaveRoomBtn.addEventListener('click', async () => {
            if (!confirm('채팅방을 나가면 대화 내용이 모두 삭제됩니다. 나가시겠습니까?')) {
                return;
            }

            const res = await fetch(`/api/chat/rooms/${roomId}/leave`, {
                method: 'POST',
                headers: {
                    [csrfHeader]: csrfToken
                }
            });

            if (!res.ok) {
                alert('채팅방 나가기에 실패했습니다.');
                return;
            }

            location.href = '/chat/rooms';
        });
    }

    window.addEventListener('beforeunload', () => {
        if (stompClient && isStompConnected) {
            stompClient.disconnect();
        }
    });
</script>

</body>
</html>
